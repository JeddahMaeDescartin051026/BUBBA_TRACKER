<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Progress Stat</title>
<style>
:root{--bg1:#efe6ff;--bg2:#c9b3f5;--bg3:#a78bfa;--text:#2a1255;--muted:#5b3f99;--glass:rgba(255,255,255,.42);--edge:rgba(255,255,255,.7);--row:rgba(124,58,237,.10);--accent:#7c3aed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1a0b3a;--bg2:#3b1d7a;--bg3:#6d3fd1;--text:#f3ecff;--muted:#cbb6f5;--glass:rgba(255,255,255,.09);--edge:rgba(255,255,255,.2);--row:rgba(255,255,255,.06);--accent:#a78bfa}}
:root[data-theme="dark"]{--bg1:#1a0b3a;--bg2:#3b1d7a;--bg3:#6d3fd1;--text:#f3ecff;--muted:#cbb6f5;--glass:rgba(255,255,255,.09);--edge:rgba(255,255,255,.2);--row:rgba(255,255,255,.06);--accent:#a78bfa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,var(--bg3),transparent 45%),radial-gradient(circle at 90% 90%,var(--bg2),transparent 50%),linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed}
header{padding:28px 20px 8px;text-align:center}
h1{margin:0;font-size:13px;letter-spacing:.3em;color:var(--muted)}
h2.agent{margin:6px 0 0;font-size:clamp(22px,4vw,34px);letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;padding:16px 20px 100px;max-width:1200px;margin:auto}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:20px;padding:18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 40px rgba(60,20,120,.25)}
.card h3{margin:0 0 12px;font-size:15px;letter-spacing:.15em;color:var(--muted)}
table{width:100%;border-collapse:separate;border-spacing:0 6px}
td,th{padding:9px 12px;text-align:left;font-size:14px}
th{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:600;padding-top:0;padding-bottom:0}
tbody td{background:var(--row)}tbody td:first-child{border-radius:10px 0 0 10px}tbody td:last-child{border-radius:0 10px 10px 0}
td.v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.yes,.no{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:800;font-size:13px}
.yes{background:#22c55e;color:#04210f}.no{background:#ef4444;color:#fff}
.lo{color:#ef4444}
.edit{width:70px;text-align:right;font:inherit;font-weight:700;color:var(--text);background:rgba(255,255,255,.25);border:1px solid var(--edge);border-radius:8px;padding:3px 6px}
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:1px solid var(--edge);background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 8px 28px rgba(109,40,217,.5)}
.modal{position:fixed;inset:0;background:rgba(20,5,50,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.modal.on{display:flex}
.panel{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:20px;width:min(1100px,100%);max-height:88vh;display:flex;flex-direction:column;padding:16px;background-color:rgba(40,15,90,.55);color:#f3ecff}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.bar b{font-size:15px}.bar small{opacity:.75}
.bar button{border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;background:#8b5cf6;color:#fff;margin-left:6px}
.sheet{overflow:auto;border-radius:10px;background:#fff}
.sheet table{border-collapse:collapse;border-spacing:0;width:max-content;color:#111}
.sheet td,.sheet th{border:1px solid #d9d4e8;padding:4px 8px;font-size:12.5px;min-width:90px;height:26px;white-space:nowrap;background:#fff}
.sheet th{background:#ece6fb;color:#4c2a99;text-align:center;position:sticky;top:0}
.sheet td.n{background:#ece6fb;color:#4c2a99;min-width:34px;text-align:center;position:sticky;left:0}
.sheet tr:first-of-type td:not(.n){font-weight:700;background:#f6f2ff}
.sheet td:focus{outline:2px solid #7c3aed;outline-offset:-2px}
</style></head><body>
<header><h1>PROGRESS STAT</h1><h2 class="agent" id="agent"></h2></header>
<div class="grid">
<div class="card"><h3>MTD TABLE</h3><table id="mtd"></table></div>
<div class="card"><h3>SALES TABLE</h3><table id="sales"></table></div>
<div class="card"><h3>KPI TABLE</h3><table id="kpi"></table></div>
</div>
<button class="fab" id="fab" title="Open data sheet" aria-label="Open data sheet">&#128214;</button>
<div class="modal" id="modal"><div class="panel">
<div class="bar"><div><b>Data sheet</b> <small>Click a cell and paste (Ctrl+V) your Excel data, headers in row 1</small></div>
<div><button id="clear">Clear</button><button id="close">Done</button></div></div>
<div class="sheet" id="sheet"></div></div></div>
<script>
const AGENT="JEDDAH MAE DESCARTIN";
const HDR=["Agent Name","Voice Answered","Voice Answered AHT","Voice CSAT","Voice FCR","Voice Agent Resolution","Voice Answered Take Rate (calibrated)","Voice Answered Transfer to Survey % (calibrated)","Voice Handled Transfer % (calibrated)","Status - Pay to Performance","Voice Sentiment Trend Avg","Revenue - Bookings (Post Recoup)","Revenue - ACQ + CROSS (Post Recoup)","Revenue - REN (Post Recoup)"];
const SAMPLE=["Jeddah Mae Descartin","198","1536","4.96","87.20%","92.30%","40.90%","61.10%","3.90%","88%","28.71","4739","2040","2700"];
const PCT=["voicefcr","voiceagentresolution","voiceansweredtakeratecalibrated","voiceansweredtransfertosurveycalibrated","voicehandledtransfercalibrated","statuspaytoperformance"];
let data=[HDR.slice(),SAMPLE.slice()],days={w:22,s:22};
try{const d=JSON.parse(localStorage.getItem("ps_data")||"null");if(d&&d.length)data=d;const k=JSON.parse(localStorage.getItem("ps_days")||"null");if(k)days=k}catch(e){}
const save=()=>{try{localStorage.setItem("ps_data",JSON.stringify(data));localStorage.setItem("ps_days",JSON.stringify(days))}catch(e){}};
const norm=s=>String(s==null?"":s).toLowerCase().replace(/[^a-z0-9]/g,"");
const colIdx=n=>(data[0]||[]).findIndex(h=>norm(h)===norm(n));
const getRow=()=>{const i=colIdx("Agent Name");return i<0?null:data.slice(1).find(r=>norm(r[i])===norm(AGENT))};
function num(n){const r=getRow(),i=colIdx(n);if(!r||i<0)return NaN;const s=String(r[i]==null?"":r[i]).trim();if(!s)return NaN;let v=parseFloat(s.replace(/[$,%\s]/g,""));if(isNaN(v))return NaN;if(PCT.includes(norm(n))&&(s.includes("%")||v>1))v/=100;return v}
const ok=v=>!isNaN(v);
const P=v=>ok(v)?(v*100).toFixed(1)+"%":"—";
const N=(v,d=0)=>ok(v)?v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const $=v=>ok(v)?"$"+N(v,2):"—";
const tier=(v,list,dir,last)=>{if(!ok(v))return NaN;for(const[t,s]of list){if(dir>0?v>=t:v<=t)return s}return last};
const sc={
aht:v=>tier(v,[[920,1],[930,.9],[939,.8],[949,.7],[959,.6]],-1,.5),
csat:v=>tier(v,[[4.96,1.1],[4.93,1],[4.89,.9],[4.85,.8]],1,.5),
res:v=>tier(v,[[.97,1.1],[.94,1],[.92,.9],[.9,.8],[.871,.7]],1,.5),
trf:v=>tier(v,[[.12,1.1],[.129,1],[.139,.9],[.145,.8],[.149,.7]],-1,.5),
pay:v=>tier(v,[[.87,1.1],[.83,1],[.8,.9],[.77,.8],[.75,.7],[.73,.6]],1,.5)};
const row3=(a,b,c)=>`<tr><td>${a}</td><td class="v">${b}</td>${c===undefined?"":`<td class="v">${c}</td>`}</tr>`;
const badge=q=>q===null?"—":`<span class="${q?"yes":"no"}">${q?"YES":"NO"}</span>`;
function render(){
document.getElementById("agent").textContent=AGENT;
const ans=num("Voice Answered"),aht=num("Voice Answered AHT"),csat=num("Voice CSAT"),fcr=num("Voice FCR"),res=num("Voice Agent Resolution"),take=num("Voice Answered Take Rate (calibrated)"),trf=num("Voice Answered Transfer to Survey % (calibrated)"),pay=num("Status - Pay to Performance"),book=num("Revenue - Bookings (Post Recoup)"),acq=num("Revenue - ACQ + CROSS (Post Recoup)"),ren=num("Revenue - REN (Post Recoup)");
document.getElementById("mtd").innerHTML="<thead><tr><th>METRIC</th><th style='text-align:right'>SCORE</th></tr></thead><tbody>"+
row3("CALLS",N(ans))+row3("AHT",N(aht))+row3("CSAT",N(csat,2))+row3("VRR",P(res))+row3("FCR",P(take))+row3("XFER TO SURVEY",P(trf))+row3("P2P",P(pay))+"</tbody>";
const tot=ok(acq)&&ok(ren)?acq+ren:NaN,pc=ok(acq)&&ok(ans)&&ans?acq/ans:NaN;
const miss=ok(pc)?(pc<10?10*ans-acq:0):NaN;
let inc=NaN;if(ok(book)){inc=0;const K=[500,1000,2000,3000,3500,4000,4500,5000,5500,6000,6500,7000],V=[1750,3250,4750,5000,5100,5250,5750,6250,6500,7000,7500,8000];K.forEach((k,i)=>{if(book>=k)inc=V[i]})}
const kick=ok(book)?Math.round(Math.max(book-7000,0)*0.035*60.59*100)/100:NaN;
const q1=ok(take)&&ok(csat)&&ok(pc)?(take>=.25&&csat>=4.9&&pc>=10):null;
document.getElementById("sales").innerHTML="<thead><tr><th>METRIC</th><th style='text-align:right'>VALUE</th></tr></thead><tbody>"+
row3("ACQ",$(acq))+row3("RENEWAL",$(ren))+row3("TOTAL",$(tot))+
row3("$/CALL",ok(pc)?`<span class="${pc<10?"lo":""}">${$(pc)}</span>`:"—")+row3("Missing ACQ (target $10/call)",$(miss))+row3("INCENTIVES",$(inc))+row3("KICKER",$(kick))+row3("QUALIFIED?",badge(q1))+"</tbody>";
const s=[sc.aht(aht),sc.csat(csat),sc.res(res),sc.trf(trf),sc.pay(pay)];
const pcnt=s.every(ok)?s.reduce((a,b)=>a+b,0)/5:NaN;
const mult=days.s?days.w/days.s:NaN;
const q2=ok(take)&&ok(csat)&&ok(pc)?(take>=.25&&csat>=4.9&&pc>=10):null;
const sp=v=>ok(v)?Math.round(v*100)+"%":"—";
document.getElementById("kpi").innerHTML="<thead><tr><th>METRIC</th><th style='text-align:right'>ACTUAL</th><th style='text-align:right'>SCORE</th></tr></thead><tbody>"+
`<tr><td>Days Worked</td><td class="v" colspan="2"><input class="edit" type="number" min="0" id="dw" value="${days.w}"></td></tr>`+
`<tr><td>Days Scheduled</td><td class="v" colspan="2"><input class="edit" type="number" min="0" id="ds" value="${days.s}"></td></tr>`+
row3("AHT",N(aht),sp(s[0]))+row3("CSAT",N(csat,2),sp(s[1]))+row3("VRR",P(res),sp(s[2]))+row3("XFER TO SURVEY",P(trf),sp(s[3]))+row3("P2P",P(pay),sp(s[4]))+
row3("ABSENCE","","100%")+row3("LATE","","100%")+row3("MULTIPLIER","",sp(mult))+row3("PERCENTAGE","",sp(pcnt))+row3("QUALIFIED?","",badge(q2))+"</tbody>";
const dw=document.getElementById("dw"),ds=document.getElementById("ds");
dw.oninput=()=>{days.w=parseFloat(dw.value)||0;save();render();document.getElementById("dw").focus()};
ds.oninput=()=>{days.s=parseFloat(ds.value)||0;save();render();document.getElementById("ds").focus()};
}
const colName=c=>{let s="";c++;while(c>0){const m=(c-1)%26;s=String.fromCharCode(65+m)+s;c=Math.floor((c-1)/26)}return s};
function grid(){
const R=Math.max(data.length+8,22),C=Math.max(114,...data.map(r=>r.length));
let h="<table><thead><tr><th></th>";
for(let c=0;c<C;c++)h+=`<th>${colName(c)}</th>`;
h+="</tr></thead><tbody>";
for(let r=0;r<R;r++){h+=`<tr><td class="n">${r+1}</td>`;for(let c=0;c<C;c++){const v=(data[r]&&data[r][c])||"";h+=`<td contenteditable="true" data-r="${r}" data-c="${c}">${String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;")}</td>`}h+="</tr>"}
document.getElementById("sheet").innerHTML=h+"</tbody></table>";
}
const sheet=document.getElementById("sheet");
sheet.addEventListener("input",e=>{const t=e.target;if(!t.dataset||t.dataset.r===undefined)return;const r=+t.dataset.r,c=+t.dataset.c;while(data.length<=r)data.push([]);data[r][c]=t.textContent;save();render()});
sheet.addEventListener("paste",e=>{const t=e.target.closest("td[data-r]");if(!t)return;e.preventDefault();
const txt=(e.clipboardData||window.clipboardData).getData("text");
const rows=txt.replace(/\r/g,"").replace(/\n+$/,"").split("\n").map(l=>l.split("\t"));
const r0=+t.dataset.r,c0=+t.dataset.c;
rows.forEach((cells,i)=>{while(data.length<=r0+i)data.push([]);cells.forEach((v,j)=>{data[r0+i][c0+j]=v.trim()})});
save();grid();render()});
const modal=document.getElementById("modal");
document.getElementById("fab").onclick=()=>{grid();modal.classList.add("on")};
document.getElementById("close").onclick=()=>{modal.classList.remove("on");render()};
document.getElementById("clear").onclick=()=>{data=[[]];save();grid();render()};
modal.addEventListener("click",e=>{if(e.target===modal){modal.classList.remove("on");render()}});
render();
</script></body></html>
